# ============================================================================
# journals.yaml — 期刊候选库（种子数据）
#
# ⚠️ 重要声明
# 本文件中的 impact_factor / quartile / review_weeks 均为**种子快照**，
# 用途仅限：(1) 构建初筛候选池  (2) 无网络时的 fallback
#
# S4 阶段必须联网核实这些数值。任何输出给用户的影响因子都必须带
# year + source + retrieved_at 三元组，且如实标注是否来自本地缓存。
# 期刊指标每年变动，投稿前请到期刊官网 / JCR 自行复核。
#
# 扩充方法见 CONTRIBUTING.md#扩充期刊库
# 字段语义见 references/journal-database.md
# ============================================================================

meta:
  version: "1.0.0"
  seed_snapshot_note: "指标为 JCR 2023-2024 区间的近似快照，未逐条核实，仅作候选池构建用"
  last_curated: "2026-08-19"
  total_journals: 24
  coverage_note: |
    当前覆盖偏向：应用数学、运筹优化、工业工程、能源系统、交通、
    复杂网络、数据驱动建模。欢迎 PR 扩充其他方向。

# ----------------------------------------------------------------------------
# 标签取值域（scope_tags / method_tags 必须从此处取值，保证匹配可计算）
# ----------------------------------------------------------------------------
taxonomy:
  scope_tags:
    - applied-mathematics
    - mathematical-modelling
    - operations-research
    - optimization
    - industrial-engineering
    - systems-engineering
    - transportation
    - energy-systems
    - environmental-modelling
    - epidemiology
    - finance-economics
    - supply-chain
    - complex-networks
    - control-theory
    - reliability
    - decision-science
    - computational-science
    - data-science
    - machine-learning-applications
    - simulation
    - biomathematics
    - manufacturing
    - urban-planning
    - risk-analysis

  method_tags:
    - ode-pde
    - dynamical-systems
    - stochastic-processes
    - queueing-theory
    - linear-programming
    - integer-programming
    - nonlinear-programming
    - multi-objective-optimization
    - metaheuristics
    - game-theory
    - graph-theory
    - statistical-modelling
    - time-series
    - bayesian-inference
    - machine-learning
    - deep-learning
    - agent-based-modelling
    - monte-carlo
    - numerical-simulation
    - sensitivity-analysis
    - fuzzy-logic
    - data-envelopment-analysis
    - ahp-topsis
    - cellular-automata

# ----------------------------------------------------------------------------
# 匹配算法权重（scripts/journals/match_journals.py 消费）
# ----------------------------------------------------------------------------
matching:
  weights:
    scope_fit: 0.35        # scope_tags 交集程度
    method_fit: 0.25       # method_tags 交集程度
    quality_fit: 0.20      # 论文分数与期刊档位的适配度
    tier_alignment: 0.10   # 分区与 assessment.tier 的对齐
    practical_fit: 0.10    # 审稿周期、OA、APC 等实务因素
  quality_bands:
    # total_score 区间 → 建议期刊档位
    - { min: 8.5, max: 10.0, target_quartiles: [Q1],         note: "可冲刺顶刊" }
    - { min: 7.5, max: 8.5,  target_quartiles: [Q1, Q2],     note: "Q1 有希望" }
    - { min: 6.5, max: 7.5,  target_quartiles: [Q2, Q3],     note: "稳妥选择" }
    - { min: 5.5, max: 6.5,  target_quartiles: [Q3, Q4],     note: "先求发表" }
    - { min: 0.0, max: 5.5,  target_quartiles: [],           note: "建议先补充研究内容" }
  min_recommendations: 3
  max_recommendations: 5
  require_gradient: true   # 推荐中应包含冲刺/稳妥/保底梯度

# ----------------------------------------------------------------------------
# 掠夺性期刊排查信号（S4 必须对照检查）
# ----------------------------------------------------------------------------
predatory_signals:
  - 承诺极短审稿周期（如 "peer review within 72 hours"）
  - 邮件主动约稿且措辞夸张
  - 编委名单无法核实或成员不知情
  - 收录声明模糊（如自称 "indexed in Google Scholar" 却无 SCIE/Scopus）
  - APC 与出版质量明显不符
  - 官网无 ISSN 或 ISSN 无法在 portal.issn.org 查到
  - 期刊名高度模仿知名期刊
verification_sources:
  - "Web of Science Master Journal List (mjl.clarivate.com)"
  - "Scopus Source List"
  - "DOAJ (doaj.org)"
  - "portal.issn.org"

