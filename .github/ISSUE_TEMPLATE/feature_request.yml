name: Feature request
description: 提议新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为、可能的实现位置（prompts/ 或 scripts/）。
    validations:
      required: true
  - type: textarea
    id: journals
    attributes:
      label: 若涉及期刊库
      description: 请附期刊名称、ISSN、官方模板与 IF 来源（须可核实，禁止 unverified 数值冒充）。
