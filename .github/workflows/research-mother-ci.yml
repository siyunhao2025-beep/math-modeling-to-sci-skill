name: Research Mother CI and source staging
on:
  push:
    branches: ["feature/research-mother-mlt-v0.1"]
    paths: ["research-mother/**", ".github/workflows/research-mother-ci.yml"]
  pull_request:
    paths: ["research-mother/**", ".github/workflows/research-mother-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF parser
        run: python -m pip install -r research-mother/requirements.txt
      - name: Run regression suite
        run: python -m unittest discover -s research-mother/tests -v
      - name: Build source-only skill archive
        run: python research-mother/scripts/research.py package artifacts/research-mother-v0.1.0.zip > package-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-mother-skill
          path: |
            artifacts/*.zip
            package-report.json
  live-discovery:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Crossref live smoke test, not relevance validation
        run: |
          SINCE=$(date -u -d '30 days ago' +%F)
          UNTIL=$(date -u +%F)
          python research-mother/scripts/research.py search --query "geomagnetic storm SABER temperature" --since "$SINCE" --until "$UNTIL" --rows 5 --pages 1 --out live-search
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-mother-live-search
          path: live-search/
  upstream-sources:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Stage five pinned source archives, never execute them
        run: python research-mother/scripts/upstream.py --out upstream-source-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-mother-upstream-sources
          path: upstream-source-cache/
